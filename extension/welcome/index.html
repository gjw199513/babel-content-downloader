<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Babel Content Downloader</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <nav class="topbar" aria-label="Babel Content Downloader">
        <a class="brand" href="index.html">
          <img src="../icons/icon-128.png" alt="" width="42" height="42">
          <span class="brand-copy">
            <span class="brand-name">Babel Content Downloader</span>
            <span class="brand-subtitle" data-i18n="localExtension"></span>
          </span>
        </a>
        <div class="topbar-actions">
          <label class="language-field" for="language"><span data-i18n="language"></span>
            <select id="language">
              <option value="auto" data-i18n="followBrowser"></option>
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
            </select>
          </label>
          <a class="text-link" href="../settings/index.html" data-i18n="openSettings"></a>
        </div>
      </nav>

      <main>
        <section class="hero" aria-labelledby="page-heading">
          <div class="hero-copy">
            <p class="eyebrow" data-i18n="eyebrow"></p>
            <h1 id="page-heading" data-i18n="heading"></h1>
            <p class="intro" data-i18n="intro"></p>
          </div>
          <aside class="status-panel panel" id="status-panel" aria-labelledby="connection-heading">
            <div class="status-heading">
              <span class="status-dot" aria-hidden="true"></span>
              <p class="section-label" id="connection-heading" data-i18n="connection"></p>
            </div>
            <p class="status" id="connection-status" role="status" aria-live="polite"></p>
            <p class="status-detail" id="connection-detail"></p>
            <div class="button-row status-actions">
              <button id="connect" type="button" data-i18n="connect"></button>
              <a class="text-link" href="../settings/index.html" data-i18n="manageConnection"></a>
            </div>
            <p id="notice" class="notice" role="status" hidden></p>
            <details class="technical-details">
              <summary data-i18n="technicalDetails"></summary>
              <dl>
                <div><dt data-i18n="extensionId"></dt><dd><code id="extension-id">—</code></dd></div>
                <div><dt data-i18n="version"></dt><dd><code id="extension-version">—</code></dd></div>
                <div><dt data-i18n="bridge"></dt><dd><code id="bridge-url">http://127.0.0.1:4318</code></dd></div>
              </dl>
            </details>
            <details class="error-details" id="error-details" hidden>
              <summary data-i18n="errorHeading"></summary>
              <pre id="raw-error"></pre>
            </details>
          </aside>
        </section>

        <section class="workflow" aria-labelledby="workflow-heading">
          <div class="section-heading">
            <div>
              <p class="section-label" data-i18n="howTo"></p>
              <h2 id="workflow-heading" data-i18n="quickStart"></h2>
            </div>
            <p data-i18n="howToIntro"></p>
          </div>
          <ol class="steps">
            <li><span>01</span><h3 data-i18n="stepChooseTitle"></h3><p data-i18n="stepChooseBody"></p></li>
            <li><span>02</span><h3 data-i18n="stepAskTitle"></h3><p data-i18n="stepAskBody"></p></li>
            <li><span>03</span><h3 data-i18n="stepUseTitle"></h3><p data-i18n="stepUseBody"></p></li>
          </ol>
        </section>

        <section class="prompts" aria-labelledby="prompts-heading">
          <div class="section-heading compact">
            <div>
              <p class="section-label" data-i18n="promptExamples"></p>
              <h2 id="prompts-heading" data-i18n="commonRequests"></h2>
            </div>
          </div>
          <div class="prompt-grid">
            <article><span data-i18n="articleLabel"></span><p data-i18n="usageArticle"></p></article>
            <article><span data-i18n="audioLabel"></span><p data-i18n="usageAudio"></p></article>
            <article><span data-i18n="videoLabel"></span><p data-i18n="usageVideo"></p></article>
          </div>
          <details class="more-prompts">
            <summary data-i18n="moreExamples"></summary>
            <div class="prompt-grid secondary-prompts">
              <article><span data-i18n="paperLabel"></span><p data-i18n="usagePaper"></p></article>
              <article><span data-i18n="subtitleLabel"></span><p data-i18n="usageSubtitle"></p></article>
            </div>
            <p class="result-note" data-i18n="usageResult"></p>
            <p class="limit-note" data-i18n="usageLimits"></p>
          </details>
        </section>
      </main>

      <footer>
        <p data-i18n="footer"></p>
        <p data-i18n="privacyNote"></p>
      </footer>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
